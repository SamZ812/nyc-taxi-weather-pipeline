[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ingest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "boto3"
]

[project.optional-dependencies]
dev = ["pytest", "moto[s3]", "responses"]

[tool.pytest.ini_options]
testpaths = ["tests"]
